<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOLDEN DOME — style test</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;display:grid;place-items:center;overflow:hidden}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}
</style>
<canvas id=c width=624 height=288></canvas>
<script>
// 624x288 = 2.167:1, 1.5x the old canvas. 78x36 tiles of 8px.
const W=624,H=288,HUD=18,GY=H-HUD;
const c=document.getElementById('c'),g=c.getContext('2d');
g.imageSmoothingEnabled=false;
function fit(){const s=Math.max(1,Math.min(innerWidth/W,innerHeight/H));c.style.width=(W*s|0)+'px';c.style.height=(H*s|0)+'px';}
addEventListener('resize',fit);fit();

// ---- palette ---------------------------------------------------------------
const SKY  =['#3d84d6','#529ae2','#69aeec','#84c2f2','#a3d5f8','#c6e6fb'];
const CLOUD=['#ffffff','#f0f7ff','#d5e7f8','#b3d0ec','#93b6dd'];
const FARM =['#9fc4e0','#8fb8da','#7fadd4'];
const MIDM =['#84b0cc','#6e9dbe','#5f8fb2'];
const ROCK =['#241f1c','#332d27','#433b32','#544a3e','#66594a','#7a6b58','#8f7e68','#a69479','#bfab8e'];
const SNOW =['#b6c4d8','#d7e2f0','#f2f7ff'];
const PINE =['#0f2c17','#1a4522','#26632f'];
const STL  =['#2a2f3a','#3d4550','#525c6b','#6e7987','#8f9aa8','#b9c4d1'];
const CY   =['#0a7f9e','#00c8ef','#7ceaff','#c9f6ff'];
const OR   =['#c25a10','#ff8a2b','#ffd98a'];
const YOU  =['#7d5a12','#c9902a','#ffc94d','#ffe79a','#fff8e0'];
const THEM =['#5c1524','#a82840','#d94040','#f2703f','#ffb072'];
const SUN  =['#ffd85c','#ffeb8f','#fff8d0'];
const B8=[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],
          [3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
const dith=(x,y)=>B8[x&7][y&7]/64;
const hash=(i,sd)=>{const v=Math.sin((i+sd*911.7)*127.1)*43758.5453;return v-Math.floor(v);};
const vn=(x,per,sd)=>{const i=Math.floor(x/per),f=x/per-i,u=f*f*(3-2*f);return hash(i,sd)*(1-u)+hash(i+1,sd)*u;};

// ---- terrain: peaked range, flat shelves carved into the flanks -----------
const hash0=(i,sd)=>{const v=Math.sin((i+sd*911.7)*127.1)*43758.5453;return v-Math.floor(v);};
const vn0=(x,per,sd)=>{const i=Math.floor(x/per),f=x/per-i,u=f*f*(3-2*f);return hash0(i,sd)*(1-u)+hash0(i+1,sd)*u;};
function makeRange(peaks,base,jag,sd){
  const h=new Float32Array(624);
  for(let x=0;x<624;x++){
    let v=base;
    // convex profile: gentle near the summit, steep skirt -> wide terraces + deep valleys
    for(const p of peaks){const t=1-Math.abs(x-p.x)/p.w; if(t>0)v=Math.max(v,p.h*Math.pow(t,0.6));}
    v+=(vn0(x,9,sd)-0.5)*jag+(vn0(x,4,sd+5)-0.5)*jag*0.55+(vn0(x,26,sd+9)-0.5)*jag*0.9;
    h[x]=Math.max(6,v);
  }
  return h;
}
const PEAKS=[{x:95, h:82,w:85},{x:145,h:62,w:48},          // short + wide: terraces can form,
             {x:330,h:78,w:85},{x:375,h:60,w:48},          // and gaps stay open for valley cities
             {x:560,h:84,w:88},{x:515,h:62,w:48}];
const MH=makeRange(PEAKS,16,3,3);
(function smooth(){                                    // box blur, so terracing gives clean runs
  const t=Float32Array.from(MH);
  for(let x=0;x<624;x++){let sum=0,n=0;
    for(let k=-6;k<=6;k++){const j=x+k;if(j>=0&&j<624){sum+=t[j];n++;}}
    MH[x]=sum/n;}
})();
const STEP=9;
{                                                      // adaptive terracing: snap gentle ground to
  const src=Float32Array.from(MH);                     // steps, leave steep skirts as smooth slope
  for(let x=0;x<624;x++){
    const sl=Math.abs((src[Math.min(623,x+3)]-src[Math.max(0,x-3)])/6);
    const a=Math.max(0,Math.min(1,1-sl/1.4));
    MH[x]=Math.round(src[x]*(1-a)+Math.round(src[x]/STEP)*STEP*a);
  }
}
const RUNS=[];
{let st=0;
 for(let x=1;x<=624;x++) if(x===624||MH[x]!==MH[st]){ if(x-st>=15)RUNS.push({x0:st,x1:x-1,h:MH[st],len:x-st}); st=x; }}
const byLen=[...RUNS].sort((a2,b2)=>b2.len-a2.len);
const lowFirst=[...RUNS].sort((a2,b2)=>(a2.h-b2.h)||(b2.len-a2.len));
const CITYS=[];                                        // cities: lowest wide ledges, kept apart
for(let minLen=34;CITYS.length<2&&minLen>=14;minLen-=6)
  for(const r of lowFirst){
    if(CITYS.length>=2)break;
    if(r.len<minLen)continue;
    const c=(r.x0+r.x1)/2;
    if(CITYS.every(q=>Math.abs((q[0]+q[1])/2-c)>140))CITYS.push([r.x0+1,r.x1-1]);
  }
if(CITYS.length<2)CITYS.push([150,215],[420,485]);      // fallback if the range generated no ledges
const PLAT=[];                                         // batteries: spread across the rest
for(let gap=52;PLAT.length<5&&gap>=16;gap-=9)
  for(const r of byLen){
    if(PLAT.length>=5||r.len<16)continue;
    const c=Math.round((r.x0+r.x1)/2);
    if(CITYS.some(q=>c>=q[0]-10&&c<=q[1]+10))continue;
    if(PLAT.every(q=>Math.abs(q-c)>gap))PLAT.push(c);
  }
PLAT.sort((a2,b2)=>a2-b2);
console.log('[map] runs',RUNS.length,'cities',JSON.stringify(CITYS),'plat',JSON.stringify(PLAT));
const TOP=new Int16Array(624);
for(let x=0;x<624;x++)TOP[x]=(288-18)-Math.round(MH[x]);
const groundY=x=>TOP[Math.max(0,Math.min(623,x|0))];

// ---- background prerender --------------------------------------------------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
const b=bg.getContext('2d');
const px=(x,y,col)=>{if(x<0||x>=W||y<0||y>=H)return;b.fillStyle=col;b.fillRect(x,y,1,1);};

for(let y=0;y<GY;y++)for(let x=0;x<W;x++){
  const t=Math.pow(y/GY,0.7)*(SKY.length-1), i=Math.min(SKY.length-2,t|0), f=t-i;
  px(x,y,(f>dith(x,y))?SKY[i+1]:SKY[i]);
}
(function sun(){
  const sx=524,sy=34;
  for(let r=17;r>=0;r--)for(let a=0;a<360;a+=3){
    const x=(sx+Math.cos(a*Math.PI/180)*r)|0, y=(sy+Math.sin(a*Math.PI/180)*r)|0;
    if(r>12){ if(dith(x,y)>0.34)continue; px(x,y,SUN[0]); }
    else if(r>8){ px(x,y,dith(x,y)>0.55?SUN[1]:SUN[0]); }
    else px(x,y,SUN[2]);
  }
})();
function cloud(cx,cy,scale,seed){
  const n=5+((hash(seed,2)*3)|0), puffs=[];
  for(let i=0;i<n;i++){
    const t=i/(n-1)-0.5;
    const r=(6+hash(seed+i,5)*10)*scale*(1-Math.abs(t)*0.55);
    puffs.push({x:cx+t*32*scale,y:cy-r*0.45-hash(seed+i,9)*4*scale,r});
  }
  const R=38*scale;
  for(let y=(cy-R)|0;y<=cy+4;y++)for(let x=(cx-R*1.4)|0;x<=cx+R*1.4;x++){
    let cover=-99, ctop=999;
    for(const p of puffs){
      const d=p.r-Math.hypot(x-p.x,(y-p.y)*1.25);
      if(d>cover)cover=d;
      if(Math.abs(x-p.x)<p.r)ctop=Math.min(ctop,p.y-p.r*0.8);
    }
    if(cover<0)continue;
    if(cover<1.8&&dith(x,y)>0.45)continue;
    const dv=(y-ctop)/Math.max(8,(cy+4-ctop));
    let col=CLOUD[0];
    if(dv>0.55)col=CLOUD[2];
    if(dv>0.78)col=CLOUD[3];
    if(dv>0.5&&dv<0.62&&dith(x,y)>0.5)col=CLOUD[1];
    if(dv>0.72&&dv<0.82&&dith(x,y)>0.5)col=CLOUD[2];
    px(x,y,col);
  }
}
[[70,74,1.2,1],[196,48,0.9,2],[318,86,1.35,3],[420,44,0.8,4],[560,92,1.05,5],[16,104,0.95,6],[604,60,0.85,7],[248,124,0.7,8]].forEach(a=>cloud(...a));

function ridge(pts,sd,amp){
  const h=new Float32Array(W);
  for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1];
    for(let x=x0;x<=x1;x++){const t=(x-x0)/(x1-x0),f=(1-Math.cos(t*Math.PI))/2;h[x]=y0+(y1-y0)*f;}}
  for(let x=0;x<W;x++)h[x]=Math.max(4,Math.round(h[x]+((vn(x,44,sd)-0.5)*2.2+(vn(x,16,sd+3)-0.5)*1.1)*amp));
  return h;
}
function mountains(h,pal){
  for(let x=0;x<W;x++){const top=GY-h[x];
    for(let y=top;y<GY;y++){
      const d=y-top;
      let col=pal[1];
      if(d<4)col=pal[0];
      else if(d<13&&dith(x,y)>d/13)col=pal[0];
      else if(d>22&&dith(x,y)<0.35)col=pal[2];
      px(x,y,col);
    }
  }
}
mountains(makeRange([{x:40,h:132,w:96},{x:170,h:158,w:110},{x:300,h:120,w:88},{x:430,h:166,w:118},{x:560,h:130,w:100}],54,9,11),FARM);
mountains(makeRange([{x:110,h:126,w:92},{x:255,h:150,w:104},{x:400,h:112,w:86},{x:540,h:144,w:106}],40,11,17),MIDM);

const SNOWLINE=GY-72, TREELINE=GY-54;
const PINEART=['..2..','.212.','.111.','11211','..0..'];
function paintRange(Hh,off,allowSnow,flat){
  const slp=x=>(Hh[Math.min(W-1,x+2)]-Hh[Math.max(0,x-2)])/4;
  for(let x=0;x<W;x++){
    const top=GY-Math.round(Hh[x]), sl=slp(x);
    const light=Math.max(-1,Math.min(1,-sl*1.7));       // sun high-right, soft terminator
    for(let y=top;y<GY;y++){
      const d=y-top;
      const wx=x+(vn(y,19,71)-0.5)*26, wy=y+(vn(x,23,73)-0.5)*18;   // warped -> patches, not bands
      const facet=vn(wx,15,41)*0.6+vn(wy,11,47)*0.4;
      let idx=Math.round(3.9+off+light*2.6+(facet-0.5)*3.0-Math.min(2,d/80)*1.5);
      if(d<2)idx+=light>0?2:1;
      if(vn(x*2.2-y*0.9,4,53)>0.90&&vn(y*0.8,13,59)>0.45)idx-=2;
      let col=ROCK[Math.max(0,Math.min(8,idx))];
      if(allowSnow&&top<SNOWLINE&&light>-0.25){
        const dep=3+(SNOWLINE-top)/7+vn(x*3,6,61)*9;
        if(d<dep)col=SNOW[d<1?2:(dith(x,y)>0.4?1:0)];
      }
      px(x,y,col);
    }
  }
}
function paintTrees(Hh,dens,skipFlat){
  for(let x=3;x<W-3;x++){
    const top=GY-Math.round(Hh[x]);
    if(top<TREELINE)continue;
    if(hash(x,71)<dens)continue;
    for(let r=0;r<5;r++)for(let cc=0;cc<5;cc++){
      const ch=PINEART[r][cc]; if(ch==='.')continue; px(x-2+cc,top-4+r,PINE[+ch]);
    }
  }
}
paintRange(MH,0,true,null); paintTrees(MH,0.86,false);

function drawCity(cx0,cx1){
  const blocks=[[3,8],[4,13],[3,10],[5,16],[3,7],[4,12],[3,9],[5,14],[4,7],[3,13]];
  let x=cx0+5, i=(cx0*3)|0;
  while(x<cx1-7){
    const [bw,bh]=blocks[i++%blocks.length], base=groundY(x+(bw>>1))+1, top=base-bh;
    for(let yy=top;yy<base;yy++)for(let xx=x;xx<x+bw;xx++)
      px(xx,yy, xx===x?STL[5]:xx===x+bw-1?STL[2]:(dith(xx,yy)>0.5?STL[4]:STL[3]));
    for(let xx=x;xx<x+bw;xx++)px(xx,top,STL[5]);
    for(let wy=top+2;wy<base-1;wy+=3)for(let xx=x+1;xx<x+bw-1;xx++)
      px(xx,wy, hash(xx*7+wy,3)>0.78?OR[1]:CY[1]);
    if(bh>13){px(x+(bw>>1),top-4,STL[3]);px(x+(bw>>1),top-5,CY[2]);}
    x+=bw+2;
  }
}
CITYS.forEach(([a2,z2])=>drawCity(a2,z2));

// ---- sprites: 24x24 --------------------------------------------------------
const SPM={'0':STL[0],'1':STL[1],'2':STL[2],'3':STL[3],'4':STL[4],'5':STL[5],
           'a':CY[0],'b':CY[1],'c':CY[2],'d':OR[0],'e':OR[1],'f':OR[2]};
const D=n=>'.'.repeat(n);
const BASE=[                                   // shared 12-wide footing
  '.3333333333.','.3222222223.','.32b2222b23.','.3111111113.','.3222222223.','.3333333333.','.0000000000.'];
const LAUNCH=[D(12),D(12),
  '...c....c...','...4....4...','...4....4...','...4....4...',
  '..44444444..','..45555554..','..4b5555b4..','..45555554..','..44444444..',
  ...BASE, D(12),D(12)];
const TURRET=[D(12),D(12),
  '......5.....','.....54.....','....544.....','...5443.....',
  '..54443.....','..54443.....','..344433....','..b44443....','..3333333...',
  ...BASE, D(12),D(12)];
const DISH=[D(12),D(12),
  '....c.......','...ccc......','..cbbbc.....','..cb5bc.....',
  '..4b5b4.....','...45554....','....444.....','....444.....','..3333333...',
  ...BASE, D(12),D(12)];
function blit(sp,px_,py,swap){
  for(let y=0;y<sp.length;y++){const row=sp[y];
    for(let x=0;x<row.length;x++){
      const ch=row[x]; if(ch==='.')continue;
      g.fillStyle=(swap&&swap[ch])||SPM[ch]; g.fillRect(px_+x,py+y,1,1);
    }}
}
const ORANGE={'b':OR[1],'c':OR[2]};
const OUTLINE={};'0123456abcdef'.split('').forEach(k=>OUTLINE[k]=STL[0]);

const KIND=[
  {sp:LAUNCH,range:225,cool:60},
  {sp:DISH,  range:144,cool:24,laser:1},
  {sp:TURRET,range:150,cool:30},
  {sp:LAUNCH,range:190,cool:44},
  {sp:TURRET,range:156,cool:26,swap:ORANGE},
];
const BATT=PLAT.map((cx,i)=>({...KIND[i%KIND.length],x:cx-6}));

BATT.forEach(t=>{t.y=groundY(t.x+6)-18;t.t=(Math.random()*t.cool)|0;});

// ---- entities --------------------------------------------------------------
const CITYX=CITYS.map(([a2,z2])=>({x:(a2+z2)>>1,w:z2-a2-16}));
const G=0.0020;
let foes=[],ints=[],booms=[],beams=[],tick=0;
function launch(mirv){
  const ct=CITYX[(Math.random()*CITYX.length)|0];
  const tx=ct.x+(Math.random()-0.5)*ct.w;
  const x0=Math.max(4,Math.min(W-4,tx+(Math.random()*2-1)*280)), y0=-12;
  const ty=groundY(tx), T=240+Math.random()*90;
  foes.push({x:x0,y:y0,vx:(tx-x0)/T,vy:((ty-y0)-0.5*G*T*T)/T,mirv:!!mirv,r:mirv?4:3,trail:[]});
}
const split=f=>{for(let i=0;i<3;i++)foes.push({x:f.x,y:f.y,vx:f.vx+(i-1)*0.42,vy:f.vy*0.85,mirv:false,r:3,trail:[]});};
const boom=(x,y,k)=>booms.push({x,y,a:0,k});

function step(){
  tick++;
  if(tick%38===0)launch(Math.random()<0.35);
  for(const f of foes){
    f.trail.push(f.x|0,f.y|0); if(f.trail.length>90)f.trail.splice(0,2);
    f.x+=f.vx; f.vy+=G; f.y+=f.vy;
    if(f.y>=groundY(f.x)){f.dead=1;boom(f.x,groundY(f.x)-2,0);}
    if(f.x<-20||f.x>W+20)f.dead=1;
  }
  for(const t of BATT){
    if(--t.t>0)continue;
    let best=null,bp=-1;
    for(const f of foes){ if(f.dead||f.lock)continue;
      if(Math.hypot(f.x-t.x-6,f.y-t.y-10)>t.range)continue;
      if(f.y>bp){bp=f.y;best=f;} }
    if(!best)continue;
    t.t=t.cool;
    const sx=t.x+6,sy=t.y+3;
    if(t.laser){
      beams.push({x0:sx,y0:sy-4,x1:best.x,y1:best.y,a:0});
      best.dead=1;boom(best.x,best.y,2); if(best.mirv)split(best);
    }else{
      best.lock=1;
      const sp=3.8, eta=Math.hypot(best.x-sx,best.y-sy)/sp;
      const a=Math.atan2(best.y+best.vy*eta+0.5*G*eta*eta-sy, best.x+best.vx*eta-sx);
      ints.push({x:sx,y:sy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,tgt:best,trail:[]});
    }
  }
  for(const m of ints){
    m.trail.push(m.x|0,m.y|0); if(m.trail.length>44)m.trail.splice(0,2);
    m.x+=m.vx;m.y+=m.vy;
    if(m.tgt.dead){m.dead=1;continue;}
    if(Math.hypot(m.tgt.x-m.x,m.tgt.y-m.y)<6){
      m.dead=1;m.tgt.dead=1;boom(m.tgt.x,m.tgt.y,1); if(m.tgt.mirv)split(m.tgt);
    }
    if(m.y<-14||m.x<-14||m.x>W+14)m.dead=1;
  }
  for(const e of booms)if(++e.a>15)e.dead=1;
  for(const e of beams)if(++e.a>5)e.dead=1;
  foes=foes.filter(f=>!f.dead);ints=ints.filter(m=>!m.dead);
  booms=booms.filter(e=>!e.dead);beams=beams.filter(e=>!e.dead);
}

function draw(){
  g.drawImage(bg,0,0);
  g.fillStyle=STL[5];
  for(const t of BATT){const cx=t.x+6,cy=t.y+10;
    for(let a=0;a<360;a+=14){const r=a*Math.PI/180;g.fillRect((cx+Math.cos(r)*t.range)|0,(cy+Math.sin(r)*t.range)|0,1,1);}}
  for(const t of BATT){
    for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) blit(t.sp,t.x+dx,t.y+dy,OUTLINE);
    blit(t.sp,t.x,t.y,t.swap);
  }
  for(const f of foes){
    for(let i=0;i<f.trail.length;i+=2){
      const age=(f.trail.length-i)/f.trail.length;
      if(age>0.4&&(i>>1)%2)continue;
      if(age>0.7&&(i>>1)%3)continue;
      g.fillStyle=age>0.55?CLOUD[4]:age>0.28?CLOUD[3]:THEM[3];
      g.fillRect(f.trail[i],f.trail[i+1],1,1);
    }
    g.fillStyle=THEM[0];g.fillRect((f.x-f.r)|0,(f.y-f.r)|0,f.r*2,f.r*2);
    g.fillStyle=THEM[2];g.fillRect((f.x-f.r+1)|0,(f.y-f.r)|0,f.r*2-2,f.r*2-1);
    g.fillStyle=THEM[4];g.fillRect(f.x|0,(f.y+f.r-1)|0,1,1);
    if(f.mirv){g.fillStyle=YOU[4];g.fillRect((f.x-1)|0,(f.y-1)|0,3,3);}
  }
  for(const m of ints){
    for(let i=0;i<m.trail.length;i+=2){
      const age=(m.trail.length-i)/m.trail.length;
      if(age>0.5&&(i>>1)%2)continue;
      g.fillStyle=age>0.6?CLOUD[2]:age>0.3?YOU[3]:YOU[4];
      g.fillRect(m.trail[i],m.trail[i+1],1,1);
    }
    g.fillStyle=YOU[4];g.fillRect(m.x|0,m.y|0,1,3);
    g.fillStyle=YOU[2];g.fillRect(m.x|0,(m.y+3)|0,1,1);
  }
  for(const e of beams){
    const n=Math.hypot(e.x1-e.x0,e.y1-e.y0)|0;
    for(let i=0;i<n;i++){
      const x=(e.x0+(e.x1-e.x0)*i/n)|0, y=(e.y0+(e.y1-e.y0)*i/n)|0;
      g.fillStyle=e.a<2?CY[3]:(dith(x,y)>0.4?CY[2]:CY[1]);
      g.fillRect(x,y,1,1);
    }
  }
  for(const e of booms){
    const st=(e.a/16*3)|0, rad=[4,8,11][st];
    const pal=e.k===2?[CY[3],CY[2],CY[0]]:e.k?[YOU[4],OR[1],OR[0]]:[YOU[4],OR[1],THEM[1]];
    for(let yy=-rad;yy<=rad;yy++)for(let xx=-rad;xx<=rad;xx++){
      const d2=xx*xx+yy*yy; if(d2>rad*rad)continue;
      const edge=d2>(rad-3)*(rad-3);
      if(edge&&dith(e.x+xx,e.y+yy)>0.55)continue;
      g.fillStyle=edge?pal[2]:(d2<6?pal[0]:pal[1]);
      g.fillRect((e.x+xx)|0,(e.y+yy)|0,1,1);
    }
  }
  g.fillStyle=STL[0];g.fillRect(0,GY,W,HUD);
  g.fillStyle=STL[2];g.fillRect(0,GY,W,1);
  let sx=8;
  [SKY,CLOUD,FARM,MIDM,ROCK,SNOW,PINE,STL,CY,OR,YOU,THEM,SUN].forEach(ramp=>{
    ramp.forEach(col=>{g.fillStyle=col;g.fillRect(sx,GY+6,5,8);sx+=5;}); sx+=4;
  });
}
(function loop(){step();draw();requestAnimationFrame(loop);})();
</script>
