<!doctype html>
<meta charset="utf-8">
<title>GOLDEN DOME — bestiary preview</title>
<style>
  body{background:#0b1220;color:#e6edf3;font:14px ui-monospace,Menlo,monospace;padding:24px}
  h1{font-size:16px;color:#ffc94d}
  .row{display:flex;gap:32px;align-items:flex-end;margin:18px 0;border-bottom:1px solid #2c3440;padding-bottom:14px}
  .fam{width:80px;color:#9aa6b2;text-transform:uppercase}
  .v{text-align:center}
  .v img{image-rendering:pixelated;display:block;margin:0 auto 6px}
  .v .n{color:#7ceaff}.v .s{color:#586373;font-size:12px}
</style>
<iframe src="golden-dome-v4.html" style="display:none"></iframe>
<h1>BESTIARY — base / mk2 / mk3</h1>
<div id=out>loading…</div>
<script>
const FAMS=[['lug',3],['needle',3],['hive',3],['anvil',3],['wasp',3],['warden',3],['pip',1],['ghost',1]];
onload=()=>{const GD=document.querySelector('iframe').contentWindow.GD;
  const out=document.getElementById('out');out.textContent='';
  for(const [fam,n] of FAMS){
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<div class=fam>${fam}</div>`;
    for(let i=1;i<=n;i++){
      const k=i===1?fam:fam+i, img=GD.IMG[k], d=GD.TT[k];
      const sc=fam==='warden'?5:6;
      row.innerHTML+=`<div class=v><img src="${img.toDataURL()}" width=${img.width*sc} height=${img.height*sc}>
        <div class=n>${k}</div><div class=s>hp ${d.hp} · T ${d.T} · $${d.$}${d.pips?' · '+d.pips+' pips':''}</div></div>`;
    }
    out.appendChild(row);
  }
};
</script>
