<style>
  html, body { margin: 0; min-height: 100%; background: #0b1220; color: #e6edf3; font: bold 14px ui-monospace, Menlo, monospace; }
  body { display: grid; place-items: center; padding: 24px 12px; box-sizing: border-box; }
  h1 { color: #ffc94d; letter-spacing: 0.2em; font-size: 26px; margin: 0 0 4px; text-align: center; }
  p { color: #9aa6b2; margin: 0 0 20px; text-align: center; }
  .maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; max-width: 900px; width: 100%; }
  a.map { display: block; color: inherit; text-decoration: none; background: #1d222b; border: 2px solid #404a58; padding: 8px; }
  a.map:hover, a.map:focus { border-color: #ffc94d; outline: none; }
  a.map canvas { width: 100%; image-rendering: pixelated; display: block; background: #63a9e7; }
  a.map b { display: block; color: #ffc94d; margin: 8px 0 2px; letter-spacing: 0.1em; }
  a.map span { color: #c2ccd6; font-weight: normal; font-size: 12px; }
  .opts { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; }
  .opts > label, .seg { display: flex; align-items: center; background: #1d222b; border: 2px solid #404a58; }
  .opts > label { padding: 0 10px; gap: 10px; }
  .opts b { color: #77838f; font-size: 11px; letter-spacing: 0.15em; }
  #seed { font: inherit; width: 7em; background: none; color: #ffc94d; border: 0; padding: 8px 0; outline: none; }
  #seed::placeholder { color: #77838f; font-weight: normal; }
  .opts > label:focus-within, .seg:focus-within { border-color: #ffc94d; }
  .seg { padding: 0; margin: 0; }
  .seg b { padding: 0 10px; }
  .seg label { position: relative; padding: 8px 10px; color: #c2ccd6; cursor: pointer; border-left: 2px solid #404a58; letter-spacing: 0.1em; }
  .seg input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .seg label:has(:checked) { background: #ffc94d; color: #0b1220; }
  .seg label:hover { color: #ffc94d; }
  .seg label:has(:checked):hover { color: #0b1220; }
</style>
<h1>GOLDEN DOME</h1>
<p>pick a map</p>
<nav class="maps" id="maps"></nav>
<div class="opts">
  <label><b>SEED</b><input id="seed" placeholder="random" inputmode="numeric" autocomplete="off"></label>
  <fieldset class="seg" id="diff"><b>DIFFICULTY</b>
    <label>EASY<input type="radio" name="diff" value="easy"></label><label>NORMAL<input type="radio" name="diff" value="normal" checked></label><label>HARD<input type="radio" name="diff" value="hard"></label><label>EXPERT<input type="radio" name="diff" value="expert"></label>
  </fieldset>
</div>
<script type="module">
  import { MAPS } from './sim/maps.js';
  import { W, GY } from './sim/cfg.js';
  const seedIn = document.getElementById('seed'), diffIn = document.getElementById('diff'), nav = document.getElementById('maps');
  const Q = new URLSearchParams(location.search);
  seedIn.value = Q.get('seed') || '';
  const diff = () => diffIn.querySelector(':checked').value;
  (diffIn.querySelector(`[value="${Q.get('diff')}"]`) || {}).checked = true;
  const href = (k) => `play.html?map=${k}` + (seedIn.value ? `&seed=${Number(seedIn.value) || ''}` : '') + (diff() !== 'normal' ? `&diff=${diff()}` : '');
  const relink = () => { for (const a of nav.children) a.href = href(new URL(a.href).searchParams.get('map')); };
  diffIn.addEventListener('change', relink);
  for (const m of Object.values(MAPS)) {
    const a = document.createElement('a'); a.className = 'map'; a.href = href(m.key);
    const cv = document.createElement('canvas'); cv.width = W / 2; cv.height = GY / 2;
    const g = cv.getContext('2d');
    for (const f of m.flats) { g.fillStyle = '#655949'; g.fillRect(f.x0 / 2, f.y / 2, (f.x1 - f.x0) / 2, GY); g.fillStyle = '#6cbf57'; g.fillRect(f.x0 / 2, f.y / 2, (f.x1 - f.x0) / 2, 2); }
    g.fillStyle = '#c2ccd6'; for (const c of m.cities) { const y = m.flats.find(f => c.a >= f.x0 && c.z <= f.x1).y / 2; for (let x = c.a / 2; x < c.z / 2; x += 3) g.fillRect(x, y - 6 - (x * 7 % 9), 2, 6 + (x * 7 % 9)); }
    g.fillStyle = '#ffc94d'; for (const [x, y] of m.slots) g.fillRect(x / 2 - 2, y / 2 - 3, 4, 3);
    a.append(cv, Object.assign(document.createElement('b'), { textContent: m.name }), Object.assign(document.createElement('span'), { textContent: m.blurb }));
    nav.append(a);
  }
  seedIn.addEventListener('input', relink);
</script>
