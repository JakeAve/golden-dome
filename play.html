<!doctype html>
<meta charset="utf-8">

<title>GOLDEN DOME</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230b1220'/%3E%3Cpath d='M2 10h1v-2h1v-1h1v-1h1v-1h4v1h1v1h1v1h1v2h1v3h-1v-3h-1v-2h-1v-1h-1v-1h-4v1h-1v1h-1v2h-1v3h-1z' fill='%23ffc94d'/%3E%3Cpath d='M4 9h1v5h-1zM6 8h2v6h-2zM9 10h1v4h-1zM11 9h1v5h-1z' fill='%23c2ccd6'/%3E%3Crect x='7' y='9' width='1' height='1' fill='%237ceaff'/%3E%3Crect x='11' y='11' width='1' height='1' fill='%23ff8a2b'/%3E%3Crect y='14' width='16' height='2' fill='%2338883a'/%3E%3C/svg%3E">

<canvas id=c width=624 height=288></canvas>
<a href="." style="position:fixed;top:6px;left:8px;color:#9aa6b2;font:bold 12px ui-monospace,Menlo,monospace;text-decoration:none">◀ MAPS</a>
<div id=boot style="position:fixed;inset:0;display:grid;place-items:center;color:#c2ccd6;font:14px ui-monospace,Menlo,monospace;text-align:center;padding:1em">Loading… if this stays, serve over HTTP: <code>deno task serve</code> → http://localhost:4507/</div>
<script type="module">
  import { createGame } from './sim/game.js';
  import { W, H, HUD, GY, TP, BP, SPR, MK } from './sim/cfg.js';
  import { MAPS } from './sim/maps.js';
  document.getElementById('boot').remove();
  const Q = new URLSearchParams(location.search);
  const seed = Number(Q.get('seed')) || (Date.now() % 1e9);
  const MAP = MAPS[Q.get('map')] || MAPS.valley;
  const FLATS = MAP.flats, FLOOR = Math.max(...FLATS.map(f => f.y));
  const game = createGame({ seed, map: MAP });
  // 624x288 = 2.167:1 -> iPhone 17 landscape (874x402pt) edge to edge.
  const c = document.getElementById('c'), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  function fit() { const s = Math.max(1, Math.min(innerWidth / W, innerHeight / H)); c.style.width = (W * s | 0) + 'px'; c.style.height = (H * s | 0) + 'px'; }
  addEventListener('resize', fit); fit();

  // ---- palette ---------------------------------------------------------------
  const SKY = ['#2f7fd0', '#4a95dc', '#63a9e7', '#7fbdf0', '#9dd0f6', '#bfe2fb', '#dcf0fd'];
  const CLOUD = ['#ffffff', '#eef6ff', '#d3e5f7', '#b2cdea', '#93b3d9'];
  const FAR = ['#b6d3ea', '#9ec2e0', '#88b1d6', '#749fc9'];      // haze range, back
  const MID = ['#9dc0cf', '#82a9bb', '#6b93a6', '#577f92'];      // haze range, front
  const MIDG = ['#6f9e79', '#5b8a66', '#487455'];                // green on the mid range
  const GRS = ['#0f3318', '#1a4a22', '#27682d', '#38883a', '#4da346', '#6cbf57', '#93d873', '#b9ea94'];
  const ROCK = ['#2b2723', '#3d3730', '#51473c', '#655949', '#7a6b57', '#8f7f68', '#a5947c', '#bcab92', '#d2c4ac'];
  const RIV = ['#1d4a72', '#2c6b9c', '#4291c4', '#6fb6de', '#a8dcf2', '#e2f5ff'];
  const STL = ['#1d222b', '#2c3440', '#404a58', '#586373', '#77838f', '#9aa6b2', '#c2ccd6', '#e6edf3'];
  const CY = ['#0a7f9e', '#00c8ef', '#7ceaff', '#c9f6ff'];
  const OR = ['#c25a10', '#ff8a2b', '#ffd98a'];
  const YOU = ['#7d5a12', '#c9902a', '#ffc94d', '#ffe79a', '#fff8e0'];
  const THEM = ['#5c1524', '#a82840', '#d94040', '#f2703f', '#ffb072'];
  const RED = ['#8e1420', '#e03a3a', '#ff8a72'];

  const B8 = [[0, 32, 8, 40, 2, 34, 10, 42], [48, 16, 56, 24, 50, 18, 58, 26], [12, 44, 4, 36, 14, 46, 6, 38], [60, 28, 52, 20, 62, 30, 54, 22],
  [3, 35, 11, 43, 1, 33, 9, 41], [51, 19, 59, 27, 49, 17, 57, 25], [15, 47, 7, 39, 13, 45, 5, 37], [63, 31, 55, 23, 61, 29, 53, 21]];
  const dith = (x, y) => B8[(x & 7 + 8) & 7][(y & 7 + 8) & 7] / 64;
  const hash = (i, sd) => { const v = Math.sin((i + sd * 911.7) * 127.1) * 43758.5453; return v - Math.floor(v); };
  const vn = (x, per, sd) => { const i = Math.floor(x / per), f = x / per - i, u = f * f * (3 - 2 * f); return hash(i, sd) * (1 - u) + hash(i + 1, sd) * u; };
  const fbm = (x, per, sd) => vn(x, per, sd) * 0.55 + vn(x, per / 2.3, sd + 31) * 0.3 + vn(x, per / 5.7, sd + 67) * 0.15;
  const cl = (v, a, z) => v < a ? a : v > z ? z : v;
  const pick = (ramp, i) => ramp[cl(Math.round(i), 0, ramp.length - 1)];

  // ---- background prerender --------------------------------------------------
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const b = bg.getContext('2d');
  const px = (x, y, col) => { if (x < 0 || x >= W || y < 0 || y >= GY) return; b.fillStyle = col; b.fillRect(x, y, 1, 1); };

  // sky: bright at the horizon, deeper overhead
  (function sky() {
    const HZ = 200;
    for (let y = 0; y < GY; y++)for (let x = 0; x < W; x++) {
      const t = Math.pow(cl(y / HZ, 0, 1), 0.85) * (SKY.length - 1), i = cl(t | 0, 0, SKY.length - 2), f = t - i;
      px(x, y, (f > dith(x, y)) ? SKY[i + 1] : SKY[i]);
    }
  })();

  // cumulus: puff union with a FLAT bottom, lit from top, shaded underside
  function cloud(cx, cy, scale, seed) {
    const n = 4 + ((hash(seed, 2) * 4) | 0), puffs = [];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1) - 0.5;
      const r = (7 + hash(seed + i, 5) * 11) * scale * (1 - Math.abs(t) * 0.5);
      puffs.push({ x: cx + t * 34 * scale, y: cy - r * 0.72 - hash(seed + i, 9) * 5 * scale, r });
    }
    const R = 44 * scale;
    for (let y = (cy - R) | 0; y <= cy; y++)for (let x = (cx - R * 1.5) | 0; x <= cx + R * 1.5; x++) {
      let cover = -99, ctop = 999;
      for (const p of puffs) {
        const d = p.r - Math.hypot(x - p.x, (y - p.y) * 1.15);
        if (d > cover) cover = d;
        if (Math.abs(x - p.x) < p.r) ctop = Math.min(ctop, p.y - p.r);
      }
      if (cover < 0) continue;
      if (cover < 1.6 && dith(x, y) > 0.42) continue;
      const dv = (y - ctop) / Math.max(6, cy - ctop);
      let col = CLOUD[0];
      if (dv > 0.60) col = CLOUD[1];
      if (dv > 0.74) col = CLOUD[2];
      if (dv > 0.89) col = CLOUD[3];
      if (dv > 0.55 && dv < 0.66 && dith(x, y) > 0.5) col = CLOUD[0];
      if (dv > 0.84 && dv < 0.93 && dith(x, y) > 0.5) col = CLOUD[2];
      if (y === ((cy) | 0) && cover > 2) col = CLOUD[3];
      px(x, y, col);
    }
  }
  // a high band and a dense horizon band -> depth
  [[58, 64, 1.25, 1], [168, 44, 0.95, 2], [300, 74, 1.35, 3], [418, 40, 0.85, 4], [540, 68, 1.15, 5], [612, 96, 0.9, 6]].forEach(a => cloud(...a));
  [[24, 132, 0.62, 11], [110, 140, 0.55, 12], [196, 134, 0.7, 13], [268, 142, 0.5, 14], [352, 136, 0.62, 15],
  [432, 144, 0.55, 16], [500, 134, 0.68, 17], [578, 142, 0.52, 18], [150, 120, 0.45, 19], [398, 120, 0.42, 20]].forEach(a => cloud(...a));

  // ---- haze ranges -----------------------------------------------------------
  function range(peaks, base, jag, sd, ex) {
    const h = new Float32Array(W);
    for (let x = 0; x < W; x++) {
      let v = base;
      for (const p of peaks) { const t = 1 - Math.abs(x - p.x) / p.w; if (t > 0) v = Math.max(v, p.h * Math.pow(t, ex || 1.25)); }
      h[x] = v + (fbm(x, 30, sd) - 0.5) * jag;
    }
    return h;
  }
  function paintHaze(h, baseY, pal, green, sd) {
    for (let x = 0; x < W; x++) {
      const top = Math.round(baseY - h[x]);
      const sl = (h[cl(x + 3, 0, W - 1)] - h[cl(x - 3, 0, W - 1)]) / 6;        // sun from upper-right
      const lit = cl(-sl * 1.3, -1, 1);
      for (let y = top; y < GY; y++) {
        const d = y - top;
        let i = 1.4 - lit * 1.2 + (fbm(x * 0.7 + y * 0.9, 13, sd + 5) - 0.5) * 1.6 - cl(d / 70, 0, 1) * 0.5;
        if (d < 2) i -= 0.8;
        let col = pick(pal, i);
        if (green && d > 6 + fbm(x, 17, sd + 9) * 14) {                     // forest creeping up the flanks
          const gi = cl(1.2 - lit * 0.8 + (fbm(x * 1.3, 9, sd + 13) - 0.5) * 1.8, 0, 2);
          if (dith(x, y) < 0.72) col = green[Math.round(gi)];
        }
        px(x, y, col);
      }
    }
  }
  paintHaze(range([{ x: 20, h: 112, w: 120 }, { x: 150, h: 140, w: 130 }, { x: 296, h: 120, w: 118 }, { x: 436, h: 148, w: 140 }, { x: 596, h: 116, w: 126 }], 40, 7, 11),
    GY, FAR, null, 11);
  paintHaze(range([{ x: 70, h: 96, w: 118 }, { x: 230, h: 114, w: 134 }, { x: 378, h: 92, w: 112 }, { x: 520, h: 118, w: 140 }], 34, 16, 23, 0.8),
    GY, MID, MIDG, 23);

  // ---- rolling green hills (the band the city sits in front of) -------------
  (function hills() {
    const h = range([{ x: -10, h: 66, w: 150 }, { x: 120, h: 52, w: 120 }, { x: 250, h: 22, w: 130 }, { x: 380, h: 34, w: 130 }, { x: 520, h: 50, w: 120 }, { x: 630, h: 70, w: 150 }], 26, 16, 41, 0.85);
    const baseY = FLOOR;
    for (let x = 0; x < W; x++) {
      const top = Math.round(baseY - h[x]);
      const sl = (h[cl(x + 3, 0, W - 1)] - h[cl(x - 3, 0, W - 1)]) / 6;
      const lit = cl(-sl * 1.4, -1, 1);
      for (let y = top; y < GY; y++) {
        const d = y - top;
        // warped noise -> foliage clumps instead of horizontal banding
        const wx = x + (vn(y, 11, 53) - 0.5) * 18, wy = y + (vn(x, 9, 57) - 0.5) * 12;
        const clump = fbm(wx * 0.8, 14, 61) * 0.6 + fbm(wy * 1.4, 7, 67) * 0.4;
        let i = 4.1 + lit * 1.5 + (clump - 0.5) * 3.4 - cl(d / 90, 0, 1) * 1.6;
        if (d < 2) i += 1.1;
        if (clump > 0.74 && vn(x * 1.7, 5, 71) > 0.5) i -= 2.2;             // dark tree pockets
        px(x, y, pick(GRS, i));
      }
    }
    // scattered pines on the hill line
    const PINE = ['..2..', '.212.', '.111.', '11211', '.1210', '..0..', '..0..'];
    for (let x = 2; x < W - 2; x++) {
      if (hash(x, 83) < 0.80) continue;
      const top = Math.round(baseY - h[x]);
      if (top > baseY - 6) continue;
      for (let r = 0; r < 7; r++)for (let k = 0; k < 5; k++) { const ch = PINE[r][k]; if (ch === '.') continue; px(x - 2 + k, top - 6 + r, GRS[+ch]); }
    }
  })();

  // ---- the city, in the valley ----------------------------------------------
  function win(x, y, warm) { px(x, y, warm ? OR[1] : CY[1]); }
  function tower(x, w, topY, baseY, tone, cap) {
    for (let y = topY; y < baseY; y++)for (let xx = x; xx < x + w; xx++) {
      let i = tone;
      if (xx === x) i += 1.4; else if (xx === x + w - 1) i -= 1.2;            // lit left edge, shaded right
      else if (dith(xx, y) > 0.55) i += 0.5;
      if (y < topY + 2) i += 1.0;
      px(xx, y, pick(STL, i));
    }
    for (let y = topY + 3; y < baseY - 2; y += 5) {                          // window bands
      for (let xx = x + 1; xx < x + w - 1; xx++) {
        if (hash(xx * 13 + y * 7, 3) < 0.55) continue;
        win(xx, y, hash(xx * 5 + y, 9) > 0.82);
      }
      if (w > 7 && hash(y, 17) > 0.82) for (let xx = x + 1; xx < x + w - 1; xx++)px(xx, y + 1, CY[0]);
    }
    if (cap) { for (let xx = x - 1; xx < x + w + 1; xx++)px(xx, topY - 1, STL[6]); }
  }
  function city(ct, sd) {
    const F = game.groundY(ct.a), a = ct.a, z = ct.z, cx = (a + z) >> 1;
    // back rank: hazier, cooler
    for (let x = a + 6, i = 0; x + 10 < z - 4; x += 12, i++) {
      const w = 6 + ((hash(i, sd) * 5) | 0), h = 21 + ((hash(i, sd + 1) * 21) | 0);
      tower(x, w, F - h, F, 2.6, false);
    }
    // central spire: tapered stack + mast + hazard light
    let y = F;
    for (const [w, hgt] of [[18, 16], [14, 15], [10, 14], [7, 12]]) {
      tower(cx - (w >> 1), w, y - hgt, y, 3.4, true);
      y -= hgt;
    }
    for (let yy = y; yy > y - 12; yy--)px(cx, yy, STL[6]);
    px(cx, y - 12, RED[1]); px(cx, y - 13, RED[2]);
    for (let yy = y + 2; yy < y + 16; yy += 4) { px(cx - 1, yy, CY[2]); px(cx + 1, yy, CY[2]); }
    // front rank: brighter, wider slabs with big glass bands, clear of the spire base
    for (let x = a, i = 0; x + 9 < z; x += 14, i++) {
      const w = 9 + ((hash(i, sd + 2) * 6) | 0), h = 17 + ((hash(i, sd + 3) * 12) | 0);
      if (x + w > cx - 11 && x < cx + 11) continue;
      tower(x, w, F - h, F, 4.6, true);
    }
    // ground clutter / pads along the floor
    for (let x = a - 4; x < z + 4; x++) { px(x, F, STL[3]); px(x, F + 1, STL[2]); }
  }
  // ---- river through the valley ---------------------------------------------
  if (MAP.river) (function river() {
    for (let y = 238; y < GY; y++) {
      const cx = MAP.river + Math.sin((y - 238) / 17) * 12 + (vn(y, 9, 91) - 0.5) * 4;
      const w = 1.6 + (y - 238) * 0.20;
      for (let x = Math.round(cx - w); x <= Math.round(cx + w); x++) {
        const e = Math.abs(x - cx) / w;
        let col = RIV[e > 0.82 ? 1 : e > 0.5 ? 2 : 3];
        if (vn(x * 2 + y * 3, 5, 97) > 0.80) col = RIV[4];
        if (vn(x + y * 7, 4, 101) > 0.93) col = RIV[5];
        px(x, y, col);
        px(Math.round(cx - w) - 1, y, GRS[1]); px(Math.round(cx + w) + 1, y, GRS[2]);
      }
    }
  })();

  // ---- cliffs + grass caps (drawn last: they are the foreground) ------------
  function cliff(x0, x1, yTop, yBot, sd) {
    for (let x = x0; x < x1; x++) {
      // vertical ribbing: two beat frequencies -> columns of uneven width
      const rib = Math.sin(x / 3.1 + fbm(x, 26, sd) * 8) + Math.sin(x / 7.9 + fbm(x, 44, sd + 3) * 5) * 0.75;
      const broad = fbm(x, 19, sd + 9);
      for (let y = yTop; y < yBot; y++) {
        const d = y - yTop;
        const strata = Math.sin((y + vn(x, 46, sd + 11) * 12) / 14);      // bedding planes, gently wavy
        let i = 5.4 + rib * 2.1 + (broad - 0.5) * 3.8 + strata * 1.1 - cl(d / 95, 0, 1) * 1.8 + (dith(x, y) - 0.5) * 1.0;
        if (rib < -1.4) i -= 3.4;                                    // fissure between columns
        if (rib > 1.5) i += 1.0;                                     // sunlit rib crown
        if (d < 3) i -= 2.8;                                         // shadow under the grass lip
        let col = pick(ROCK, i);
        const veg = vn(x + y * 0.7, 15, sd + 21) * 0.55 + vn(x - y * 1.1, 10, sd + 27) * 0.45;
        if (veg > 0.83 && d > 6 && d < 44 && rib > -0.9)                      // small moss clumps, upper face only
          col = GRS[veg > 0.90 ? 3 : 2];
        px(x, y, col);
      }
    }
  }
  function grassCap(x0, x1, yTop, sd) {
    for (let x = x0; x < x1; x++) {
      const base = 3 + (vn(x, 6, sd) * 4) | 0;
      const drip = vn(x, 9, sd + 3) > 0.70 ? 4 + ((vn(x, 4, sd + 5) * 11) | 0) : 0;
      const n = base + drip;
      for (let d = 0; d < n; d++) {
        const y = yTop + d;
        let col = d === 0 ? GRS[6] : d < 2 ? GRS[5] : d < base ? GRS[4] : d < base + drip * 0.6 ? GRS[3] : GRS[2];
        if (dith(x, y) > 0.6 && d > 0 && d < base) col = GRS[d < 3 ? 6 : 3];
        px(x, y, col);
      }
      px(x, yTop - 1, GRS[7]);                                      // lit rim
    }
  }
  // tufts + pines standing on a flat top
  function dressFlat(x0, x1, y, sd, skip) {
    const PINE = ['..2..', '.212.', '.111.', '11211', '.1210', '..0..', '..0..'];
    for (let x = x0 + 3; x < x1 - 3; x++) {
      if (skip && skip.some(s => x > s - 16 && x < s + 16)) continue;
      if (MAP.cities.some(ct => x > ct.a - 6 && x < ct.z + 6)) continue;
      const r = hash(x, sd);
      if (r > 0.955) { for (let ry = 0; ry < 7; ry++)for (let k = 0; k < 5; k++) { const ch = PINE[ry][k]; if (ch === '.') continue; px(x - 2 + k, y - 6 + ry, GRS[+ch]); } }
      else if (r > 0.88) { px(x, y - 1, GRS[5]); px(x - 1, y - 1, GRS[3]); px(x + 1, y - 1, GRS[4]); px(x, y - 2, GRS[6]); }
    }
  }

  const BATTX = MAP.slots.map(sl => sl[0]);
  FLATS.forEach((f, i) => cliff(f.x0 - 4, f.x1 + 4, f.y, GY, 101 + 12 * i));
  FLATS.forEach((f, i) => grassCap(f.x0 - 2, f.x1 + 2, f.y, 101 + 12 * i));
  FLATS.forEach((f, i) => dressFlat(f.x0 + 4, f.x1 - 4, f.y, 201 + 10 * i, BATTX));
  MAP.cities.forEach((ct, i) => city(ct, 300 + i * 7));

  // dark foreground forest corners -> depth
  (function fg() {
    const PINE = ['...2...', '..212..', '.11211.', '1121121', '..111..', '.11211.', '...0...', '...0...'];
    for (const [x0, x1, by] of [[0, 120, GY + 2], [452, W, GY + 2]])
      for (let x = x0; x < x1; x += 3) {
        if (hash(x, 151) < 0.35 || MAP.cities.some(ct => x > ct.a - 12 && x < ct.z + 12)) continue;
        const y = by - ((hash(x, 157) * 10) | 0);
        for (let r = 0; r < 8; r++)for (let k = 0; k < 7; k++) {
          const ch = PINE[r][k]; if (ch === '.') continue;
          px(x - 3 + k, y - 7 + r, [GRS[0], GRS[1], GRS[2]][+ch]);
        }
      }
  })();

  // =============================================================================
  // GAME
  // =============================================================================
  const FINE = 2, FW = W * FINE, FH = H * FINE;
  c.width = FW; c.height = FH; g.imageSmoothingEnabled = false;

  function render(rows, pal, ov) {
    const cv = document.createElement('canvas'); cv.width = rows[0].length; cv.height = rows.length;
    const q = cv.getContext('2d');
    rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch === '.') continue; const col = ov && ch in ov ? ov[ch] : pal[ch]; if (!col) continue; q.fillStyle = col; q.fillRect(i, j, 1, 1); } });
    return cv;
  }
  const IMG = {};
  for (const k of ['lug', 'needle', 'hive', 'pip', 'anvil', 'wasp', 'ghost', 'warden']) IMG[k] = render(SPR[k], TP);
  for (const k of ['pac', 'thaad', 'flak', 'dew', 'icept', 'thaadr']) IMG[k] = render(SPR[k], BP);
  for (const [k, [base, ov]] of Object.entries(MK)) IMG[k] = render(SPR[base], TP, ov);
  IMG.warden_hot = render(SPR.warden, TP, { t: '#ffd98a', u: '#fff8e0' });
  IMG.hive_hot = render(SPR.hive, TP, { C: '#fff8e0' });
  IMG.wasp_lock = render(SPR.wasp, TP, { E: '#fff8e0' });
  for (const k of Object.keys(MK)) {   // variant hot/lock flashes
    if (k.startsWith('warden')) IMG[k + '_hot'] = render(SPR.warden, TP, { ...MK[k][1], t: '#ffd98a', u: '#fff8e0' });
    if (k.startsWith('hive')) IMG[k + '_hot'] = render(SPR.hive, TP, { ...MK[k][1], C: '#fff8e0' });

    }
    // HUD bar
    rect(0, GY, W, HUD, STL[0]); rect(0, GY, W, 1, STL[2]);
    text(`$${game.cash}`, 6, GY + 8, YOU[2], 20); text(`WAVE ${game.wave}/${MAXWAVE}`, 6, GY + 19, STL[5], 13);
    text('#' + seed, 502, GY + 13, STL[5], 9, 'right');
    let bx = 96;
    for (const k in BT) {
      const d = BT[k]; UI.btns.push({ x: bx, y: GY + 2, w: 78, h: HUD - 4, act: 'sel', k });
      const iy = k === 'flak' ? 4 : 0, ok = game.cash >= d.cost; // flak base sits low so base + turret centre as a whole
      button(bx, GY + 2, 78, HUD - 4, d.name, `$${d.cost}`, ok ? d.col : STL[4], sel === k, ok ? IMG[k] : IMG[k + '_dead'], iy);
      if (k === 'flak') flakTurret(fx(bx + 10), fx(GY + 2 + (HUD - 4) / 2 + iy - 7), -0.25, !ok, 0.7); // hub sits 3 left, 7 up of the sprite centre
      bx += 81;
    }
    UI.btns.push({ x: W - 78, y: GY + 2, w: 75, h: HUD - 4, act: 'start' }, { x: W - 116, y: GY + 2, w: 34, h: HUD - 4, act: 'speed' });
    button(W - 116, GY + 2, 34, HUD - 4, speed + '×' + (speedOpen ? ' ▾' : ' ▴'), null, STL[6], speed !== 1);
    if (game.phase === 'build') button(W - 78, GY + 2, 75, HUD - 4, game.wave ? 'NEXT ▶' : 'START ▶', null, YOU[3], game.tick % 40 < 20);
    else button(W - 78, GY + 2, 75, HUD - 4, `${game.queue.length + game.foes.length} inbound`, null, THEM[3]);
    if (game.phase === 'build' && game.wave < MAXWAVE) {
      const dir = game.nextBias.x < W / 3 ? 'WEST' : game.nextBias.x > W * 2 / 3 ? 'EAST' : 'CENTER';
      if (nuCache.wave !== game.wave) {
        // Preview only — waveTypes is rng-free, so it can't perturb the sim's rng stream.
        const types = [...new Set(game.waveTypes(game.wave + 1))];
        nuCache = { wave: game.wave, nu: types.filter(t => TT[t].info && !game.seen[t]) };
      }
      const nu = nuCache.nu;
      rect(0, 20, W, 14, 'rgba(10,12,20,0.7)');
      text(`WAVE ${game.wave + 1} heavy from the ${dir}` + (nu.length ? `  ·  NEW THREAT: ${TT[nu[0]].info}` : ''), W / 2, 27, nu.length ? THEM[3] : STL[7], 14, 'center');
    } else if (toast && toast.t > 0) { rect(0, 20, W, 14, 'rgba(10,12,20,0.7)'); text('NEW THREAT · ' + toast.txt, W / 2, 27, THEM[3], 14, 'center'); }
    if (sel) { const lines = wrap(BT[sel].info, W - 16, 14); rect(0, GY - 2 - lines.length * 9, W, lines.length * 9 + 1, 'rgba(10,12,20,0.75)'); lines.forEach((l, i) => text(l, W / 2, GY - lines.length * 9 + 3 + i * 9, STL[7], 14, 'center')); }
    else if (!game.wave && game.phase === 'build') { const m = batteries().length ? 'Tap START when ready' : 'Pick a battery, place it on a pad'; text(m, W / 2, GY - 10, STL[7], 16, 'center'); }
    if (game.phase === 'wave') { const txt = `heavy from the ${game.bias.x < W / 3 ? 'WEST' : game.bias.x > W * 2 / 3 ? 'EAST' : 'CENTER'}`; text(txt, W / 2, 8, THEM[3], 14, 'center'); }
    if (speedOpen) { // drop-up: slowest at top, current highlighted; unshift so it wins the hit-test
      SPEEDS.forEach((v, i) => { const y = GY + 2 - 13 * (SPEEDS.length - i); UI.btns.unshift({ x: W - 116, y, w: 34, h: 13, act: 'speedSet', v }); button(W - 116, y, 34, 13, v + '×', null, v === speed ? YOU[2] : STL[7], v === speed); });
    }
    if (game.phase === 'over' || game.phase === 'win') {
      rect(0, 0, W, H, 'rgba(10,12,20,0.6)'); text(game.phase === 'win' ? 'DOME HELD' : 'CITIES LOST', W / 2, H / 2 - 12, game.phase === 'win' ? YOU[2] : THEM[2], 28, 'center'); if (game.phase === 'over') { UI.btns.push({ x: W / 2 - 110, y: H / 2 + 4, w: 100, h: 16, act: 'retry' }, { x: W / 2 + 10, y: H / 2 + 4, w: 100, h: 16, act: 'restart' }); button(W / 2 - 110, H / 2 + 4, 100, 16, `RETRY WAVE ${game.wave}`, null, YOU[2], true); button(W / 2 + 10, H / 2 + 4, 100, 16, 'RESTART', null, STL[7]); }
      else text(`wave ${game.wave} · tap to restart`, W / 2, H / 2 + 12, STL[7], 13, 'center');
      const tot = {}; for (const b of batteries()) { const t = tot[b.kind] || (tot[b.kind] = { n: 0, k: 0, d: 0 }); t.n++; t.k += b.kills; t.d += b.dmg; }
      let yy = H / 2 + 30; for (const k in tot) text(`${BT[k].name} ×${tot[k].n}: ${tot[k].k} intercepts · ${Math.round(tot[k].d)} dmg`, W / 2, yy += 9, BT[k].col, 12, 'center');
    }
  }

  // ---- input -------------------------------------------------------------------
  let hoverSlot = null;
  function toWorld(e) { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  const nearSlot = (x, y) => SLOTS.find(s => Math.abs(s.x - x) < 14 && y > s.y - 34 && y < s.y + 10);
  c.addEventListener('pointermove', e => { const p = toWorld(e); hoverSlot = nearSlot(p.x, p.y) || null; });
  c.addEventListener('pointerdown', e => {
    e.preventDefault(); unmute(); const p = toWorld(e);
    const ui = UI.hit(p.x, p.y);
    if (ui && ui.act === 'speedSet') { speed = ui.v; speedOpen = false; return; }
    if (ui && ui.act === 'speed') { speedOpen = !speedOpen; return; }
    speedOpen = false;
    const idx = selB ? SLOTS.indexOf(selB.slot) : -1;
    if (game.phase === 'over' || game.phase === 'win') { if (ui && ui.act === 'retry') { if (game.retryWave()) { sel = null; selB = null; toast = null; } } else if (!ui || ui.act === 'restart') location.reload(); return; }
    if (ui) {
      if (ui.act === 'sel') { sel = sel === ui.k ? null : ui.k; selB = null; }
      else if (ui.act === 'start') { if (game.startWave()) { selB = null; toast = null; } }
      else if (ui.act === 'up') game.upgrade(idx);
      else if (ui.act === 'pathA' || ui.act === 'pathB') game.choosePath(idx, ui.act.slice(-1));
      else if (ui.act === 'sell') { game.sell(idx); selB = null; }
      else if (ui.act === 'repair') game.repair(idx);
      return;
    }
    const s = nearSlot(p.x, p.y);
    if (s && s.b) { selB = selB === s.b ? null : s.b; sel = null; return; }
    if (s && !s.b && sel) { game.build(SLOTS.indexOf(s), sel); return; }
    selB = null;
  });
  c.style.touchAction = 'none';

  function dispatch(e) {
    if (e.t === 'sfx') sfx(e.k);
    else if (e.t === 'shake') shake = Math.max(shake, e.n);
    else if (e.t === 'toast') toast = { txt: e.txt, t: 360 };
  }
  let acc = 0;
  (function loop() {
    acc += speed;
    while (acc >= 1) { acc--; game.step(); }
    for (const e of game.events) dispatch(e); game.events.length = 0;
    if (shake > 0) shake = Math.max(0, shake - speed);
    if (toast && (toast.t -= speed) <= 0) toast = null;
    draw();
    requestAnimationFrame(loop);
  })();
  window.GD = game;
  Object.defineProperty(game, 'speed', { get: () => speed, set: v => { speed = v; }, configurable: true });
</script>
