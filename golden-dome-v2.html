<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOLDEN DOME — v2</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;display:grid;place-items:center;overflow:hidden}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}
</style>
<canvas id=c width=624 height=288></canvas>
<script>
// 624x288 = 2.167:1 -> iPhone 17 landscape (874x402pt) edge to edge.
const W=624,H=288,HUD=26,GY=H-HUD;
const c=document.getElementById('c'),g=c.getContext('2d');
g.imageSmoothingEnabled=false;
function fit(){const s=Math.max(1,Math.min(innerWidth/W,innerHeight/H));c.style.width=(W*s|0)+'px';c.style.height=(H*s|0)+'px';}
addEventListener('resize',fit);fit();

// ---- palette ---------------------------------------------------------------
const SKY  =['#2f7fd0','#4a95dc','#63a9e7','#7fbdf0','#9dd0f6','#bfe2fb','#dcf0fd'];
const CLOUD=['#ffffff','#eef6ff','#d3e5f7','#b2cdea','#93b3d9'];
const FAR  =['#b6d3ea','#9ec2e0','#88b1d6','#749fc9'];      // haze range, back
const MID  =['#9dc0cf','#82a9bb','#6b93a6','#577f92'];      // haze range, front
const MIDG =['#6f9e79','#5b8a66','#487455'];                // green on the mid range
const GRS  =['#0f3318','#1a4a22','#27682d','#38883a','#4da346','#6cbf57','#93d873','#b9ea94'];
const ROCK =['#2b2723','#3d3730','#51473c','#655949','#7a6b57','#8f7f68','#a5947c','#bcab92','#d2c4ac'];
const RIV  =['#1d4a72','#2c6b9c','#4291c4','#6fb6de','#a8dcf2','#e2f5ff'];
const STL  =['#1d222b','#2c3440','#404a58','#586373','#77838f','#9aa6b2','#c2ccd6','#e6edf3'];
const CY   =['#0a7f9e','#00c8ef','#7ceaff','#c9f6ff'];
const OR   =['#c25a10','#ff8a2b','#ffd98a'];
const YOU  =['#7d5a12','#c9902a','#ffc94d','#ffe79a','#fff8e0'];
const THEM =['#5c1524','#a82840','#d94040','#f2703f','#ffb072'];
const RED  =['#8e1420','#e03a3a','#ff8a72'];

const B8=[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],
          [3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
const dith=(x,y)=>B8[(x&7+8)&7][(y&7+8)&7]/64;
const hash=(i,sd)=>{const v=Math.sin((i+sd*911.7)*127.1)*43758.5453;return v-Math.floor(v);};
const vn=(x,per,sd)=>{const i=Math.floor(x/per),f=x/per-i,u=f*f*(3-2*f);return hash(i,sd)*(1-u)+hash(i+1,sd)*u;};
const fbm=(x,per,sd)=>vn(x,per,sd)*0.55+vn(x,per/2.3,sd+31)*0.3+vn(x,per/5.7,sd+67)*0.15;
const cl=(v,a,z)=>v<a?a:v>z?z:v;
const pick=(ramp,i)=>ramp[cl(Math.round(i),0,ramp.length-1)];

// ---- authored terrain profile ---------------------------------------------
// side-on elevation. flat runs = buildable, the jumps between them are cliffs.
// left tall mesa -> shelf -> valley floor with the city -> shelf -> right mesa.
const FLATS=[
  {x0:-4, x1:104, y:142},   // left high mesa
  {x0:104,x1:166, y:200},   // left shelf
  {x0:166,x1:228, y:236},   // left valley lip (buildable)
  {x0:228,x1:400, y:252},   // city floor
  {x0:400,x1:462, y:234},   // right valley lip (buildable)
  {x0:462,x1:520, y:194},   // right shelf
  {x0:520,x1:628, y:152},   // right mesa
];
const TOP=new Int16Array(W);
for(let x=0;x<W;x++){let y=250;for(const f of FLATS)if(x>=f.x0&&x<f.x1)y=f.y;TOP[x]=y;}
const groundY=x=>TOP[cl(x|0,0,W-1)];

// ---- background prerender --------------------------------------------------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
const b=bg.getContext('2d');
const px=(x,y,col)=>{if(x<0||x>=W||y<0||y>=GY)return;b.fillStyle=col;b.fillRect(x,y,1,1);};

// sky: bright at the horizon, deeper overhead
(function sky(){
  const HZ=200;
  for(let y=0;y<GY;y++)for(let x=0;x<W;x++){
    const t=Math.pow(cl(y/HZ,0,1),0.85)*(SKY.length-1), i=cl(t|0,0,SKY.length-2), f=t-i;
    px(x,y,(f>dith(x,y))?SKY[i+1]:SKY[i]);
  }
})();

// cumulus: puff union with a FLAT bottom, lit from top, shaded underside
function cloud(cx,cy,scale,seed){
  const n=4+((hash(seed,2)*4)|0), puffs=[];
  for(let i=0;i<n;i++){
    const t=i/(n-1)-0.5;
    const r=(7+hash(seed+i,5)*11)*scale*(1-Math.abs(t)*0.5);
    puffs.push({x:cx+t*34*scale,y:cy-r*0.72-hash(seed+i,9)*5*scale,r});
  }
  const R=44*scale;
  for(let y=(cy-R)|0;y<=cy;y++)for(let x=(cx-R*1.5)|0;x<=cx+R*1.5;x++){
    let cover=-99,ctop=999;
    for(const p of puffs){
      const d=p.r-Math.hypot(x-p.x,(y-p.y)*1.15);
      if(d>cover)cover=d;
      if(Math.abs(x-p.x)<p.r)ctop=Math.min(ctop,p.y-p.r);
    }
    if(cover<0)continue;
    if(cover<1.6&&dith(x,y)>0.42)continue;
    const dv=(y-ctop)/Math.max(6,cy-ctop);
    let col=CLOUD[0];
    if(dv>0.60)col=CLOUD[1];
    if(dv>0.74)col=CLOUD[2];
    if(dv>0.89)col=CLOUD[3];
    if(dv>0.55&&dv<0.66&&dith(x,y)>0.5)col=CLOUD[0];
    if(dv>0.84&&dv<0.93&&dith(x,y)>0.5)col=CLOUD[2];
    if(y===((cy)|0)&&cover>2)col=CLOUD[3];
    px(x,y,col);
  }
}
// a high band and a dense horizon band -> depth
[[58,64,1.25,1],[168,44,0.95,2],[300,74,1.35,3],[418,40,0.85,4],[540,68,1.15,5],[612,96,0.9,6]].forEach(a=>cloud(...a));
[[24,132,0.62,11],[110,140,0.55,12],[196,134,0.7,13],[268,142,0.5,14],[352,136,0.62,15],
 [432,144,0.55,16],[500,134,0.68,17],[578,142,0.52,18],[150,120,0.45,19],[398,120,0.42,20]].forEach(a=>cloud(...a));

// ---- haze ranges -----------------------------------------------------------
function range(peaks,base,jag,sd,ex){
  const h=new Float32Array(W);
  for(let x=0;x<W;x++){
    let v=base;
    for(const p of peaks){const t=1-Math.abs(x-p.x)/p.w; if(t>0)v=Math.max(v,p.h*Math.pow(t,ex||1.25));}
    h[x]=v+(fbm(x,30,sd)-0.5)*jag;
  }
  return h;
}
function paintHaze(h,baseY,pal,green,sd){
  for(let x=0;x<W;x++){
    const top=Math.round(baseY-h[x]);
    const sl=(h[cl(x+3,0,W-1)]-h[cl(x-3,0,W-1)])/6;        // sun from upper-right
    const lit=cl(-sl*1.3,-1,1);
    for(let y=top;y<GY;y++){
      const d=y-top;
      let i=1.4-lit*1.2+(fbm(x*0.7+y*0.9,13,sd+5)-0.5)*1.6-cl(d/70,0,1)*0.5;
      if(d<2)i-=0.8;
      let col=pick(pal,i);
      if(green&&d>6+fbm(x,17,sd+9)*14){                     // forest creeping up the flanks
        const gi=cl(1.2-lit*0.8+(fbm(x*1.3,9,sd+13)-0.5)*1.8,0,2);
        if(dith(x,y)<0.72)col=green[Math.round(gi)];
      }
      px(x,y,col);
    }
  }
}
paintHaze(range([{x:20,h:112,w:120},{x:150,h:140,w:130},{x:296,h:120,w:118},{x:436,h:148,w:140},{x:596,h:116,w:126}],40,7,11),
          GY, FAR, null, 11);
paintHaze(range([{x:70,h:96,w:118},{x:230,h:114,w:134},{x:378,h:92,w:112},{x:520,h:118,w:140}],34,16,23,0.8),
          GY, MID, MIDG, 23);

// ---- rolling green hills (the band the city sits in front of) -------------
(function hills(){
  const h=range([{x:-10,h:66,w:150},{x:120,h:52,w:120},{x:250,h:22,w:130},{x:380,h:34,w:130},{x:520,h:50,w:120},{x:630,h:70,w:150}],26,16,41,0.85);
  const baseY=252;
  for(let x=0;x<W;x++){
    const top=Math.round(baseY-h[x]);
    const sl=(h[cl(x+3,0,W-1)]-h[cl(x-3,0,W-1)])/6;
    const lit=cl(-sl*1.4,-1,1);
    for(let y=top;y<GY;y++){
      const d=y-top;
      // warped noise -> foliage clumps instead of horizontal banding
      const wx=x+(vn(y,11,53)-0.5)*18, wy=y+(vn(x,9,57)-0.5)*12;
      const clump=fbm(wx*0.8,14,61)*0.6+fbm(wy*1.4,7,67)*0.4;
      let i=4.1+lit*1.5+(clump-0.5)*3.4-cl(d/90,0,1)*1.6;
      if(d<2)i+=1.1;
      if(clump>0.74&&vn(x*1.7,5,71)>0.5)i-=2.2;             // dark tree pockets
      px(x,y,pick(GRS,i));
    }
  }
  // scattered pines on the hill line
  const PINE=['..2..','.212.','.111.','11211','.1210','..0..','..0..'];
  for(let x=2;x<W-2;x++){
    if(hash(x,83)<0.80)continue;
    const top=Math.round(baseY-h[x]);
    if(top>246)continue;
    for(let r=0;r<7;r++)for(let k=0;k<5;k++){const ch=PINE[r][k];if(ch==='.')continue;px(x-2+k,top-6+r,GRS[+ch]);}
  }
})();

// ---- the city, in the valley ----------------------------------------------
function win(x,y,warm){px(x,y,warm?OR[1]:CY[1]);}
function tower(x,w,topY,baseY,tone,cap){
  for(let y=topY;y<baseY;y++)for(let xx=x;xx<x+w;xx++){
    let i=tone;
    if(xx===x)i+=1.4; else if(xx===x+w-1)i-=1.2;            // lit left edge, shaded right
    else if(dith(xx,y)>0.55)i+=0.5;
    if(y<topY+2)i+=1.0;
    px(xx,y,pick(STL,i));
  }
  for(let y=topY+3;y<baseY-2;y+=5){                          // window bands
    for(let xx=x+1;xx<x+w-1;xx++){
      if(hash(xx*13+y*7,3)<0.55)continue;
      win(xx,y,hash(xx*5+y,9)>0.82);
    }
    if(w>7&&hash(y,17)>0.82)for(let xx=x+1;xx<x+w-1;xx++)px(xx,y+1,CY[0]);
  }
  if(cap){for(let xx=x-1;xx<x+w+1;xx++)px(xx,topY-1,STL[6]);}
}
(function city(){
  const F=252;
  // back rank: hazier, cooler
  for(const [x,w,h] of [[234,8,28],[246,6,37],[256,10,24],[270,7,41],[282,9,30],
                        [334,8,35],[346,10,24],[360,7,38],[372,9,27],[384,8,21]])
    tower(x,w,F-h,F,2.6,false);
  // central spire: tapered stack + mast + hazard light
  (function spire(){
    const cx=312; let y=F;
    for(const [w,hgt] of [[18,16],[14,15],[10,14],[7,12]]){
      tower(cx-(w>>1),w,y-hgt,y,3.4,true);
      y-=hgt;
    }
    for(let yy=y;yy>y-12;yy--)px(cx,yy,STL[6]);
    px(cx,y-12,RED[1]);px(cx,y-13,RED[2]);
    for(let yy=y+2;yy<y+16;yy+=4){px(cx-1,yy,CY[2]);px(cx+1,yy,CY[2]);}
  })();
  // front rank: brighter, wider slabs with big glass bands
  for(const [x,w,h] of [[228,12,20],[242,14,26],[258,10,17],[270,14,28],[288,9,18],
                        [330,12,26],[344,10,18],[356,14,23],[372,11,17],[385,12,21]])
    tower(x,w,F-h,F,4.6,true);
  // skywalks between the two halves
  for(const [x0,x1,y] of [[292,332,240],[300,326,247]]){
    for(let x=x0;x<=x1;x++){px(x,y,STL[6]);px(x,y+1,STL[3]);px(x,y+2,STL[2]);
      if(x%9===0)for(let k=3;k<7;k++)px(x,y+k,STL[2]);
      if(x%3===0)px(x,y,CY[2]);}
  }
  // ground clutter / pads along the floor
  for(let x=224;x<404;x+=1){px(x,F,STL[3]);px(x,F+1,STL[2]);}
})();

// ---- river through the valley ---------------------------------------------
(function river(){
  for(let y=238;y<GY;y++){
    const cx=312+Math.sin((y-238)/17)*12+(vn(y,9,91)-0.5)*4;
    const w=1.6+(y-238)*0.20;
    for(let x=Math.round(cx-w);x<=Math.round(cx+w);x++){
      const e=Math.abs(x-cx)/w;
      let col=RIV[e>0.82?1:e>0.5?2:3];
      if(vn(x*2+y*3,5,97)>0.80)col=RIV[4];
      if(vn(x+y*7,4,101)>0.93)col=RIV[5];
      px(x,y,col);
      px(Math.round(cx-w)-1,y,GRS[1]);px(Math.round(cx+w)+1,y,GRS[2]);
    }
  }
})();

// ---- cliffs + grass caps (drawn last: they are the foreground) ------------
function cliff(x0,x1,yTop,yBot,sd){
  for(let x=x0;x<x1;x++){
    // vertical ribbing: two beat frequencies -> columns of uneven width
    const rib=Math.sin(x/3.1+fbm(x,26,sd)*8)+Math.sin(x/7.9+fbm(x,44,sd+3)*5)*0.75;
    const broad=fbm(x,19,sd+9);
    for(let y=yTop;y<yBot;y++){
      const d=y-yTop;
      const strata=Math.sin((y+vn(x,46,sd+11)*12)/14);      // bedding planes, gently wavy
      let i=5.4+rib*2.1+(broad-0.5)*3.8+strata*1.1-cl(d/95,0,1)*1.8+(dith(x,y)-0.5)*1.0;
      if(rib<-1.4)i-=3.4;                                    // fissure between columns
      if(rib>1.5)i+=1.0;                                     // sunlit rib crown
      if(d<3)i-=2.8;                                         // shadow under the grass lip
      let col=pick(ROCK,i);
      const veg=vn(x+y*0.7,15,sd+21)*0.55+vn(x-y*1.1,10,sd+27)*0.45;
      if(veg>0.83&&d>6&&d<44&&rib>-0.9)                      // small moss clumps, upper face only
        col=GRS[veg>0.90?3:2];
      px(x,y,col);
    }
  }
}
function grassCap(x0,x1,yTop,sd){
  for(let x=x0;x<x1;x++){
    const base=3+(vn(x,6,sd)*4)|0;
    const drip=vn(x,9,sd+3)>0.70?4+((vn(x,4,sd+5)*11)|0):0;
    const n=base+drip;
    for(let d=0;d<n;d++){
      const y=yTop+d;
      let col=d===0?GRS[6]:d<2?GRS[5]:d<base?GRS[4]:d<base+drip*0.6?GRS[3]:GRS[2];
      if(dith(x,y)>0.6&&d>0&&d<base)col=GRS[d<3?6:3];
      px(x,y,col);
    }
    px(x,yTop-1,GRS[7]);                                      // lit rim
  }
}
// tufts + pines standing on a flat top
function dressFlat(x0,x1,y,sd,skip){
  const PINE=['..2..','.212.','.111.','11211','.1210','..0..','..0..'];
  for(let x=x0+3;x<x1-3;x++){
    if(skip&&skip.some(s=>x>s-16&&x<s+16))continue;
    const r=hash(x,sd);
    if(r>0.955){for(let ry=0;ry<7;ry++)for(let k=0;k<5;k++){const ch=PINE[ry][k];if(ch==='.')continue;px(x-2+k,y-6+ry,GRS[+ch]);}}
    else if(r>0.88){px(x,y-1,GRS[5]);px(x-1,y-1,GRS[3]);px(x+1,y-1,GRS[4]);px(x,y-2,GRS[6]);}
  }
}

const BATTX=[30,78,122,150,184,212,416,444,478,506,546,594];
for(let i=0;i<FLATS.length;i++){
  const f=FLATS[i], nxt=FLATS[i+1];
  // a flat's cliff runs from its own top down to whatever the neighbouring lower flat is
  const down=[];
  if(nxt&&nxt.y>f.y)down.push([f.x1-2,f.x1+2,f.y,nxt.y]);
  if(i>0&&FLATS[i-1].y>f.y)down.push([f.x0-2,f.x0+2,f.y,FLATS[i-1].y]);
}
// explicit cliff faces (x span, top, bottom) matched to the profile steps
[[  0,108,142,GY,101],
 [102,170,200,GY,113],
 [164,232,236,GY,127],
 [396,466,234,GY,131],
 [458,524,194,GY,137],
 [518,W  ,152,GY,149]].forEach(a=>cliff(...a));
[[  0,108,142,101],[102,170,200,113],[164,232,236,127],
 [226,402,252,143],[396,466,234,131],[458,524,194,137],[518,W,152,149]].forEach(a=>grassCap(...a));
[[  4,102,142,201],[106,164,200,211],[168,226,236,251],[402,460,234,221],[464,518,194,231],[522,620,152,241]]
  .forEach(a=>dressFlat(a[0],a[1],a[2],a[3],BATTX));

// dark foreground forest corners -> depth
(function fg(){
  const PINE=['...2...','..212..','.11211.','1121121','..111..','.11211.','...0...','...0...'];
  for(const [x0,x1,by] of [[0,120,GY+2],[452,W,GY+2]])
    for(let x=x0;x<x1;x+=3){
      if(hash(x,151)<0.35)continue;
      const y=by-((hash(x,157)*10)|0);
      for(let r=0;r<8;r++)for(let k=0;k<7;k++){const ch=PINE[r][k];if(ch==='.')continue;
        px(x-3+k,y-7+r,[GRS[0],GRS[1],GRS[2]][+ch]);}
    }
})();

// =============================================================================
// GAME
// =============================================================================
const FINE=2, FW=W*FINE, FH=H*FINE;
c.width=FW; c.height=FH; g.imageSmoothingEnabled=false;

// ---- sprite palettes (threats from bestiary.html, batteries from armory.html)
const TP={k:'#12141c','1':'#2f3d1c','2':'#5a7028','3':'#8ba33c','4':'#b8cf5e',
  '5':'#8a99ab','6':'#c2ccd6','7':'#e6edf3','8':'#d94040','9':'#8e1420',
  a:'#3a1f5c',b:'#6b3fa0',c:'#9b6ae0',d:'#c9a6ff', e:'#2c3440',f:'#586373',g:'#9aa6b2',i:'#c9902a',
  j:'#1a1508',l:'#ffd94a',m:'#b8912a', n:'#0a7f9e',o:'#00c8ef',p:'#7ceaff',q:'#c9f6ff',
  r:'#16171f',s:'#2a2c38',t:'#ff8a2b',u:'#ffd98a', E:'#ff4d4d',W:'#fff8e0',A:'#ffc94d',C:'#7ceaff'};
const BP={k:'#12141c','1':'#3a3f4a','2':'#565d6b','3':'#7b8494','4':'#a5aebd',
  '5':'#2f3d1c','6':'#5a7028','7':'#8ba33c','8':'#b8cf5e', '9':'#6b7c94',a:'#9fb0c6',b:'#d6e2f0',c:'#f2f7ff',
  d:'#5c2a10',e:'#a3521a',f:'#e08b2a',g:'#ffbe55', h:'#0a3f5c',i:'#0a7f9e',j:'#00c8ef',l:'#7ceaff',
  x:'#d94040',y:'#8e1420', G:'#ffc94d',W:'#fff8e0',O:'#ff8a2b',C:'#7ceaff',E:'#ff4d4d',R:'#c25a10'};
const SPR={
lug:['.....kkk.....','....k433k....','...k43321k...','..k4332211k..','..k4332211k..','..k4332211k..','..k43AA211k..','..k43AW211k..','..k4332211k..','..k4332211k..','..k4332211k..','..k4kkkk11k..','..k4332211k..','..k4332211k..','..k4332211k..','.kk4332211kk.','k2k4332211k1k','k2k4332211k1k','...k22221k...'],

function composeWave(n){
  const q=[],late=1+Math.max(0,n-6)*0.14;const add=(t,k)=>{for(let i=0;i<k*late;i++)q.push(t);};
  add('lug',n<=2?2+n*2:3+(n*1.5|0));
  if(n>=5)add('needle',n-4);
  if(n>=6)add('hive',((n-3)/1.3)|0);
  if(n>=8)add('anvil',((n-5)/1.4)|0);
  if(n>=11)add('wasp',(n-8)>>1);
  if(n>=15)add('ghost',(n-11)>>1);
  if(n>=19&&(n-19)%3===0)q.push('warden');if(n>=25)q.push('warden');if(n>=29)q.push('warden');
  for(let i=q.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[q[i],q[j]]=[q[j],q[i]];}
  return q;
}

  wave++; phase='wave'; selB=null;

}

}

let SHAPER=null; const shaper=()=>{if(SHAPER)return SHAPER; const c=new Float32Array(256); for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(x*6);} SHAPER=AC.createWaveShaper(); SHAPER.curve=c; SHAPER.connect(AC.destination); return SHAPER;};
function noiseBuf(n){const buf=AC.createBuffer(1,AC.sampleRate*n|0,AC.sampleRate), ch=buf.getChannelData(0); for(let i=0;i<ch.length;i++)ch[i]=rnd()*2-1; return buf;}
function sfx(k){
  const d=SFX[k]; if(!AC||!d)return; const [w,f0,f1,dur,vol,noise,dist]=d, t=AC.currentTime, out=dist?shaper():AC.destination;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); g.connect(out);
  if(w==='sweep'){
    const src=AC.createBufferSource(), bp=AC.createBiquadFilter(); src.buffer=noiseBuf(dur); bp.type='bandpass'; bp.Q.value=6;
    bp.frequency.setValueAtTime(f0,t); bp.frequency.exponentialRampToValueAtTime(f1,t+dur); src.connect(bp).connect(g); src.start(t); return;
  }
  const o=AC.createOscillator(); o.type=w; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur); o.connect(g); o.start(t); o.stop(t+dur);
  if(!noise)return; const n=dur*(dist?0.9:0.5), src=AC.createBufferSource(), ng=AC.createGain(); src.buffer=noiseBuf(n);
  if(dist){const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(1200,t); lp.frequency.exponentialRampToValueAtTime(80,t+n); src.connect(lp).connect(ng);} else src.connect(ng);
  ng.gain.setValueAtTime(vol*0.6,t); ng.gain.exponentialRampToValueAtTime(0.001,t+n); ng.connect(out); src.start(t);

// ---- damage ------------------------------------------------------------------
function hit(f,dmg,type,src){
  if(f.dead)return; STATS.hits++;
  if(f.type==='anvil'&&type==='kinetic'){boom(f.x,f.y-4,'spark');return;}
  if(f.type==='wasp'&&type==='blast'){boom(f.x,f.y-4,'spark');return;}
  if(f.type==='warden'){dmg=type==='energy'?(src&&P(src,'pierce')?dmg:dmg*0.5):Math.max(0,dmg-2);f.flash=6;}
  if(f.type==='ghost'){f.dead=1;boom(f.x,f.y,'ghost');return;}
  dmg=Math.min(dmg,f.hp); f.hp-=dmg; if(src)src.dmg+=dmg;
  if(f.hp<=0){f.dead=1;cash+=TT[f.type].$;boom(f.x,f.y,type);sfx('kill');if(src)src.kills++;}
}
function blast(x,y,dmg,src){
  boom(x,y,'blast');
  const r=src?P(src,'radius',18):18;
  for(const f of foes)if(!f.dead&&Math.hypot(f.x-x,f.y-y)<r)hit(f,dmg,'blast',src);
}

function aimLead(sx,sy,f,sp){
  const eta=Math.hypot(f.x-sx,f.y-sy)/sp;
  return Math.atan2(f.y+f.vy*eta+0.5*G*eta*eta-sy,f.x+f.vx*eta-sx);
}
function pickTarget(b,m){
  const rg=bRange(b);let best=null,bp=-1e9;
  for(const f of foes){
    if(f.dead)continue;
    if(b.def.type==='kinetic'&&(f.type==='anvil'||(f.type==='needle'&&!P(b,'seeker'))))continue;   // guns know what they can't hurt
    if(b.def.type==='blast'&&(f.type==='wasp'||f.type==='ghost'))continue;
    if(b.def.type==='energy'&&f.type==='ghost')continue;
    const d=Math.hypot(f.x-m.x,f.y-m.y); if(d>rg)continue;
    let p=f.y; if(f.type==='hive'&&f.y<f.dy)p+=80; if(f.type==='wasp')p+=40;
    if(f.lock&&b.kind==='thaad')p-=500;
    if(p>bp){bp=p;best=f;}
  }
  return best;
}
function step(){
  tick++;
  if(phase==='wave'){
    if(queue.length&&--nextLaunch<=0){const salvo=wave>=10&&rnd()<0.25+wave*0.01?2+(wave>=20&&rnd()<0.5?1:0):1;for(let i=0;i<salvo&&queue.length;i++)launch(queue.shift());nextLaunch=gap*(0.5+rnd())*(salvo>1?1.6:1);}
    if(!queue.length&&!foes.length){
      phase='build'; rollBias(); const alive=CITIES.filter(ct=>ct.hp>0).length;
      cash+=alive*(35+wave*4); if(wave>=MAXWAVE)phase='win';
    }
  }
  for(const f of foes){
    f.trail.push(f.x|0,f.y|0); if(f.trail.length>70)f.trail.splice(0,2);
    if(f.type==='warden'){
      f.x+=Math.sin(tick/22)*1.3; f.vy+=G*0.35;
      if(++f.shed>140){f.shed=0;foes.push({type:'hive',x:f.x,y:f.y,vx:f.vx+(rnd()-0.5)*1.2,vy:f.vy*0.5,hp:3,r:8,trail:[],dy:f.y+70,born:tick});}
    }else f.vy+=G;
    f.x+=f.vx; f.y+=f.vy;
    if(f.type==='hive'&&f.y>=f.dy){f.dead=1;spawnPips(f);continue;}
    if(f.y>=groundY(f.x)){
      f.dead=1; const gy=groundY(f.x);
      const d=TT[f.type].dmg;
      if(f.type==='ghost'){boom(f.x,gy-2,'ghost');continue;}
      if(f.tgt){ if(!f.tgt.broken&&Math.abs(f.x-f.tgt.slot.x)<12){f.tgt.broken=1;f.tgt.charge=0;shake=9;} boom(f.x,gy-2,'ground'); continue; }
      const ct=CITIES.find(ct=>f.x>=ct.a-4&&f.x<=ct.z+4);
      if(ct&&ct.hp>0){STATS.leaks++;ct.hp=Math.max(0,ct.hp-d);craters.push({x:f.x|0,y:gy,born:tick});boom(f.x,gy-3,'city');sfx('city');}
      else boom(f.x,gy-2,'ground');
    }
    if(f.x<-30||f.x>W+30)f.dead=1;
    if(f.flash)f.flash--;
  }
  for(const b of batteries()){
    if(b.broken)continue;
    const m=bMuzzle(b);
    if(b.kind==='dew'&&b.charge>0){

    text(`WAVE ${wave+1} heavy from the ${dir}`+(nu.length?`  ·  NEW THREAT: ${TT[nu[0]].info}`:''),W/2,27,nu.length?THEM[3]:STL[7],14,'center');
  }else if(toast&&toast.t>0){toast.t-=speed;rect(0,20,W,14,'rgba(10,12,20,0.7)');text('NEW THREAT · '+toast.txt,W/2,27,THEM[3],14,'center');}
  if(sel){const lines=wrap(BT[sel].info,W-16,14);rect(0,GY-2-lines.length*9,W,lines.length*9+1,'rgba(10,12,20,0.75)');lines.forEach((l,i)=>text(l,W/2,GY-lines.length*9+3+i*9,STL[7],14,'center'));}
  else if(!wave&&phase==='build'){const m=batteries().length?'Tap START when ready':'Pick a battery, place it on a pad';text(m,W/2,GY-10,STL[7],16,'center');}
  if(phase==='wave'){const txt=`heavy from the ${bias.x<W/3?'WEST':bias.x>W*2/3?'EAST':'CENTER'}`;text(txt,W/2,8,THEM[3],14,'center');}
  if(phase==='over'||phase==='win'){rect(0,0,W,H,'rgba(10,12,20,0.6)');text(phase==='win'?'DOME HELD':'CITIES LOST',W/2,H/2-12,phase==='win'?YOU[2]:THEM[2],28,'center');if(phase==='over'){UI.btns.push({x:W/2-110,y:H/2+4,w:100,h:16,act:'retry'},{x:W/2+10,y:H/2+4,w:100,h:16,act:'restart'});button(W/2-110,H/2+4,100,16,`RETRY WAVE ${wave}`,null,YOU[2],true);button(W/2+10,H/2+4,100,16,'RESTART',null,STL[7]);}
    else text(`wave ${wave} · tap to restart`,W/2,H/2+12,STL[7],13,'center');
    const tot={};for(const b of batteries()){const t=tot[b.kind]||(tot[b.kind]={n:0,k:0,d:0});t.n++;t.k+=b.kills;t.d+=b.dmg;}
    let yy=H/2+30;for(const k in tot)text(`${BT[k].name} ×${tot[k].n}: ${tot[k].k} intercepts · ${Math.round(tot[k].d)} dmg`,W/2,yy+=9,BT[k].col,12,'center');}
}

// ---- input -------------------------------------------------------------------
let hoverSlot=null;
function toWorld(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
const nearSlot=(x,y)=>SLOTS.find(s=>Math.abs(s.x-x)<14&&y>s.y-34&&y<s.y+10);
c.addEventListener('pointermove',e=>{const p=toWorld(e);hoverSlot=nearSlot(p.x,p.y)||null;});
c.addEventListener('pointerdown',e=>{
  e.preventDefault(); unmute(); const p=toWorld(e);
  const ui=UI.hit(p.x,p.y);
  if(phase==='over'||phase==='win'){if(ui&&ui.act==='retry'&&snap)retryWave();else if(!ui||ui.act==='restart')location.reload();return;}
  if(ui){
    if(ui.act==='sel'){sel=sel===ui.k?null:ui.k;selB=null;}
    else if(ui.act==='start'&&phase==='build'){startWave();}
    else if(ui.act==='speed')speed=({0.5:1,1:2,2:4,4:0.5})[speed];
    else if(ui.act==='up'&&selB.lvl<2&&cash>=upCost(selB)){cash-=upCost(selB);selB.paid+=upCost(selB);selB.lvl++;}
    else if((ui.act==='pathA'||ui.act==='pathB')&&!selB.path&&cash>=upCost(selB)){cash-=upCost(selB);selB.paid+=upCost(selB);selB.path=ui.act.slice(-1);selB.lvl=3;}
    else if(ui.act==='sell'){cash+=sellVal(selB);selB.slot.b=null;selB=null;}
    else if(ui.act==='repair'&&cash>=repCost(selB)){cash-=repCost(selB);selB.broken=0;}
    return;
  }
  const s=nearSlot(p.x,p.y);
  if(s&&s.b){selB=selB===s.b?null:s.b;sel=null;return;}
  if(s&&!s.b&&sel){
    const d=BT[sel]; if(cash<d.cost)return;
    cash-=d.cost; s.b={kind:sel,def:d,slot:s,lvl:0,t:20,broken:0,charge:0,burst:0,burstT:0,aim:-1.1,kills:0,dmg:0,mag:0,magT:0,paid:d.cost,path:null}; 
    return;
  }
  selB=null;
});
c.style.touchAction='none';

// ---- one runnable check -------------------------------------------------------
(function check(){
  let bad=0;
  for(const [n,rows] of Object.entries(SPR))rows.forEach((r,i)=>{if(r.length!==rows[0].length){bad++;console.error(n,i);}});
  const w=composeWave(21); if(!w.includes('warden')||!w.includes('lug'))bad++;
  const f={type:'anvil',hp:6,x:0,y:0}; hit(f,5,'kinetic'); if(f.hp!==6)bad++; hit(f,5,'blast'); if(f.hp!==1)bad++; booms.length=0;
  console.log(bad?`GOLDEN DOME: ${bad} check(s) failed`:'GOLDEN DOME: checks ok');
})();
rollBias();let acc=0;(function loop(){acc+=speed;while(acc>=1){acc--;if(phase==='wave'||phase==='build')step();}draw();requestAnimationFrame(loop);})();
window.GD={STATS,hit,blast,pickTarget,TT,get shots(){return shots},get foes(){return foes},SLOTS,BT,CITIES,startWave,get state(){return{cash,wave,phase,tick,cities:CITIES.map(c=>c.hp)}},set cash(v){cash=v},build(i,k){const s=SLOTS[i];s.b={kind:k,def:BT[k],slot:s,lvl:0,t:20,broken:0,charge:0,burst:0,burstT:0,aim:-1.1,kills:0,dmg:0,mag:0,magT:0,paid:BT[k].cost,path:null}},set speed(v){speed=v},get speed(){return speed}};
</script>
